name: Lifeless Proxy Checks

on:
  push:
  pull_request:

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          test -f README.md
          test -f Dockerfile
          test -f docker-compose.yml
          test -f web/index.html
          test -f web/style.css
          test -f docs/security.md
